[package]
name = "rustcore"
version = "0.1.0"
edition = "2021"

[lib]
# One Rust codebase, two possible outputs:
#   staticlib -> librustcore.a / rustcore.lib   (linked INTO your C++ executable)
#   cdylib    -> librustcore.so / .dylib / .dll (a shared library / DLL)
crate-type = ["staticlib", "cdylib"]

[build-dependencies]
cbindgen = { version = "0.26", default-features = false }

[profile.dev]
# A Rust panic must never unwind into C++ (undefined behaviour).
# "abort" makes a panic terminate cleanly instead.
panic = "abort"

[profile.release]
panic = "abort"
lto = true
